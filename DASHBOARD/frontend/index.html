<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    form {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .1);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #34495e;
    }
  </style>
</head>

<body>
  <form action="/login" method="POST">
    <h2>Login</h2>
    <input type="email" name="email" placeholder="O teu email" required>
    <button type="submit">Enviar código</button>
  </form>
</body>

</html>
